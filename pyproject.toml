[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-altertable"
dynamic = ["version"]
description = "DBT adapter for Altertable"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Altertable Team", email = "leo@altertable.ai"}
]
keywords = ["dbt", "altertable", "adapter", "database", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "dbt-core>=1.8,<2.0",
    "dbt-adapters>=1.5,<2.0",
    "altertable-flightsql>=0.2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.7",
    "ruff>=0.15.11",
    "ty>=0.0.32",
    "pre-commit>=4.0",
    "conventional-pre-commit>=4.4",
]
integration = [
    "testcontainers>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/altertable-ai/dbt-altertable"
Repository = "https://github.com/altertable-ai/dbt-altertable"
Documentation = "https://github.com/altertable-ai/dbt-altertable#readme"
Changelog = "https://github.com/altertable-ai/dbt-altertable/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/altertable-ai/dbt-altertable/issues"

[tool.uv]
required-version = ">=0.9"

[tool.hatch.version]
path = "dbt/adapters/altertable/__version__.py"
pattern = "version = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["dbt"]

[tool.hatch.build.targets.sdist]
include = [
    "dbt",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["dbt/adapters/altertable"]
exclude = ["dist", "build", ".venv"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
markers = [
    "altertable_integration: Flight SQL integration (altertable-mock in CI, or ALTERTABLE_TEST_* / testcontainers locally)",
]
