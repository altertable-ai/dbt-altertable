name: 'altertable_analytics'
version: '0.1.0'
profile: 'altertable_analytics'
require-dbt-version: [">=1.11.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false
  warn_error_options:
    error: all
    warn:
      - NoNodesForSelectionCriteria
      - UnusedResourceConfigPath
  require_explicit_package_overrides_for_builtin_materializations: true
  source_freshness_run_project_hooks: true
  state_modified_compare_more_unrendered_values: true

models:
  altertable_analytics:
    +persist_docs:
      relation: true
      columns: true
    +meta:
      owner: data-platform
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      ingestion:
        +schema: marts_ingestion
      discovery:
        +schema: marts_discovery

seeds:
  altertable_analytics:
    +schema: seeds
    +quote_columns: false

snapshots:
  altertable_analytics:
    +target_schema: snapshots
