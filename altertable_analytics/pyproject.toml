[project]
name = "altertable-analytics"
version = "0.1.0"
description = "dbt project for Altertable internal operational metrics (ingestion health, discovery lifecycle)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-core>=1.11,<2.0",
    "dbt-duckdb>=1.10,<2.0",
    "elementary-data>=0.9.2,<1.0",
    "dbt-osmosis>=1.3,<2.0",
    "dbt-score>=0.9,<1.0",
]

[dependency-groups]
dev = [
    "sqlfluff>=3.5,<4.0",
    "sqlfluff-templater-dbt>=3.5,<4.0",
    "pre-commit>=4.0,<5.0",
    "ruff>=0.15,<1.0",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.uv]
package = false
