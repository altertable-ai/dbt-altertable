name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [code-quality]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run pytest (unit tests only)
        run: uv run --python ${{ matrix.python-version }} pytest -v --ignore=tests/integration

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  integration:
    name: Integration (altertable-mock)
    runs-on: ubuntu-latest
    needs: [code-quality]
    services:
      altertable:
        image: ghcr.io/altertable-ai/altertable-mock:latest
        ports:
          - 15000:15000
          - 15001:15001
          - 15002:15002
        env:
          ALTERTABLE_MOCK_USERS: dbt_ci:dbt_ci_secret
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/15002'"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    env:
      ALTERTABLE_TEST_HOST: localhost
      ALTERTABLE_TEST_PORT: "15002"
      ALTERTABLE_TEST_TLS: "false"
      ALTERTABLE_TEST_USERNAME: dbt_ci
      ALTERTABLE_TEST_PASSWORD: dbt_ci_secret
      ALTERTABLE_TEST_DATABASE: memory
      ALTERTABLE_TEST_SCHEMA: main
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run integration pytest
        run: uv run pytest tests/integration -v -n auto --dist=loadfile
